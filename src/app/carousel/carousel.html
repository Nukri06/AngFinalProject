<section class="carousel" aria-label="Featured product">
    <img class="carousel-background" [src]="currentSlide.image" alt="" aria-hidden="true">
    <div class="carousel-content">
      <h1>{{ currentSlide.title }}<br>{{ currentSlide.subtitle }}</h1>
      <p class="product-category">{{ currentSlide.category }}</p>
      <p class="product-description">{{ currentSlide.description }}</p>
      <span class="shop-button">
        Shop Now
        <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
      </span>
    </div>

    <div class="carousel-controls">
      <button class="arrow-control" type="button" aria-label="Previous slide" (click)="previousSlide()">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <div class="slide-indicators">
        @for (slide of carouselList; track slide.title; let index = $index) {
          <button
            class="slide-indicator"
            [class.active-indicator]="index === currentSlideIndex"
            [attr.aria-label]="'Go to slide ' + (index + 1)"
            [attr.aria-current]="index === currentSlideIndex ? 'true' : null"
            type="button"
            (click)="goToSlide(index)"
          ></button>
        }
      </div>
      <button class="arrow-control" type="button" aria-label="Next slide" (click)="nextSlide()">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
</section>
